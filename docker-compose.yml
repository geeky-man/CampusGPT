version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: campus_postgres
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: campusgpt
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  qdrant:
    image: qdrant/qdrant
    container_name: campus_qdrant
    restart: always

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage


  redis:
    image: redis:latest
    container_name: campus_redis
    restart: always

    ports:
      - "6379:6379"


volumes:
  postgres_data:
  qdrant_data: